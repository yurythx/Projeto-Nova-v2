# Imagens de produção no GHCR (ADR 063). Cada push na main gera as imagens
# do commit; a VM só baixa e roda (scripts/deploy.sh com NOVA_IMAGE_TAG).
#
#   ghcr.io/yurythx/projeto-nova-v2/api:sha-<commit>
#   ghcr.io/yurythx/projeto-nova-v2/worker:sha-<commit>
#   ghcr.io/yurythx/projeto-nova-v2/frontend:<ambiente>-sha-<commit>
#
# O frontend embute as URLs públicas no build (NEXT_PUBLIC_*): sai uma
# imagem por ambiente, com as URLs do GitHub Environment de mesmo nome.
# Rollback: instalar a tag de um commit anterior.
name: Release

# Só depois do CI verde na main, e sempre o commit que o CI testou.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/yurythx/projeto-nova-v2
  COMMIT: ${{ github.event.workflow_run.head_sha }}

jobs:
  backend:
    name: Imagem ${{ matrix.nome }}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # assinatura keyless (cosign + OIDC do GitHub)
    strategy:
      matrix:
        include:
          - { nome: api, arquivo: backend/Dockerfile.api }
          - { nome: worker, arquivo: backend/Dockerfile.worker }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # github.sha aponta para a main de agora; a imagem é do commit testado.
      - id: sha
        run: echo "curto=${COMMIT::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.nome }}
          labels: org.opencontainers.image.revision=${{ env.COMMIT }}
          tags: |
            type=raw,value=sha-${{ steps.sha.outputs.curto }}
            type=raw,value=main
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: ${{ matrix.arquivo }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
      - uses: sigstore/cosign-installer@v3
      - name: Assinar
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ matrix.nome }}@${{ steps.build.outputs.digest }}"

  frontend:
    name: Imagem frontend (${{ matrix.ambiente }})
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        ambiente: [producao]
    environment: ${{ matrix.ambiente }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # github.sha aponta para a main de agora; a imagem é do commit testado.
      - id: sha
        run: echo "curto=${COMMIT::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/frontend
          labels: org.opencontainers.image.revision=${{ env.COMMIT }}
          tags: |
            type=raw,value=${{ matrix.ambiente }}-sha-${{ steps.sha.outputs.curto }}
            type=raw,value=${{ matrix.ambiente }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Variáveis do GitHub Environment; sem elas, o domínio de produção.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_PUBLIC_URL || 'https://api.projetonova.cloud' }}
            NEXT_PUBLIC_WS_URL=${{ vars.WEBSOCKET_PUBLIC_URL || 'wss://projetonova.cloud/ws' }}
            NEXT_PUBLIC_MINIO_URL=${{ vars.MINIO_PUBLIC_URL || 'https://arquivos.projetonova.cloud' }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=frontend-${{ matrix.ambiente }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.ambiente }}
      - uses: sigstore/cosign-installer@v3
      - name: Assinar
        run: cosign sign --yes "${{ env.REGISTRY }}/frontend@${{ steps.build.outputs.digest }}"
