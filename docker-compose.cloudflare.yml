# ==============================================================================
# Cloudflare Tunnel - Ingress Seguro Zero Trust para o Projeto-nova-v2
# ==============================================================================
# Conecta a aplicação diretamente à rede global da Cloudflare através de um túnel
# de saída (outbound seguro), eliminando a necessidade de abrir portas 80/443 no
# firewall/roteador e dispensando proxies reversos locais (como LXC DMZ).
#
# Como ativar:
# 1. Defina a variável CLOUDFLARE_TUNNEL_TOKEN no arquivo .env
# 2. Adicione este arquivo à variável COMPOSE_FILE no .env:
#    COMPOSE_FILE=docker-compose.yml:docker-compose.cloudflare.yml
# ==============================================================================

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN precisa ser definido no .env}
    networks:
      - nexus_internal
