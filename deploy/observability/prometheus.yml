global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# O token de /metrics (METRICS_SCRAPE_TOKEN do .env da stack) chega em
# metrics_token, gravado pelo Ansible. Nunca o escreva aqui: este arquivo
# é público. A porta 8010 é o HTTP_PORT que scripts/deploy.sh grava.
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "nova-backend-api"
    metrics_path: "/metrics"
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["backend-api:8010"]
        labels:
          service: "backend-api"
          env: "production"

  - job_name: "nova-backend-worker"
    metrics_path: "/metrics"
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["backend-worker:9102"]
        labels:
          service: "backend-worker"
          env: "production"

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "vm"
          env: "production"
