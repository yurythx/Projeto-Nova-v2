global:
  resolve_timeout: 5m

# Os alertas viram incidente no atendimento pela entrada de eventos (Fase 2
# do roteiro, ADR 065). Até ela existir, ficam só na tela do Alertmanager
# (túnel SSH na porta 9093): antes, apontavam para uma rota da API que não
# existe, e todo alerta se perdia sem aviso.
route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'nulo'

receivers:
  - name: 'nulo'

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['service', 'alertname']
