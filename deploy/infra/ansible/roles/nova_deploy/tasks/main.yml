---
- name: Conferir a combinação de domínio, túnel e HTTPS local
  ansible.builtin.assert:
    that:
      - not (app_domain | length > 0 and enable_https | bool)
      - app_domain | length == 0 or cloudflare_tunnel_token | length > 0 or cloudflare_conector_ip | length > 0
      - not (cloudflare_tunnel_token | length > 0 and cloudflare_conector_ip | length > 0)
    fail_msg: >-
      Com app_domain, o TLS vem da Cloudflare: deixe enable_https=false e
      escolha um conector, nunca os dois: cloudflare_conector_ip (o
      cloudflared do LXC 101, em group_vars/all.yml) ou o token de um túnel
      próprio em ansible/cloudflare.secrets.yml.
    quiet: true

- name: Criar pasta raiz de projetos
  ansible.builtin.file:
    path: "{{ app_dir | dirname }}"
    state: directory
    mode: "0755"

- name: Verificar se o checkout do Projeto-nova-v2 já existe
  ansible.builtin.stat:
    path: "{{ app_dir }}/.git"
  register: app_checkout

- name: "Clonar o repositório só na primeira vez (depois: sincronizar-vm, sem force)"
  ansible.builtin.git:
    repo: "{{ app_git_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_git_version }}"
    force: false
    update: false
  when: not app_checkout.stat.exists

# Compose e scripts do mesmo commit das imagens: sem isso, uma versão nova
# subiria com o docker-compose.yml de outra. Arquivo versionado alterado
# à mão no servidor faz o git recusar, de propósito (force: false).
- name: Alinhar o checkout ao commit da imagem
  ansible.builtin.git:
    repo: "{{ app_git_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_image_tag | regex_replace('^sha-', '') }}"
    force: false
    update: true
  when: app_image_tag | length > 0

# Com o domínio, o cloudflared só abre conexões de saída: nada além do SSH
# precisa entrar. Sem ele, o navegador fala direto com as portas da stack.
- name: Liberar portas no UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    comment: Trafego Projeto-nova-v2
  loop: "{{ ['22'] if app_domain | length > 0 else ['22', '80', '443', '3010', '8010', '8443', '9010', '9011', '9443'] }}"

- name: Garantir execução dos scripts de deploy
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    mode: "0755"
  loop:
    - scripts/deploy.sh
    - scripts/enable-https.sh

- name: Gerar o .env e as chaves (sem subir nada ainda)
  ansible.builtin.command:
    cmd: "bash scripts/deploy.sh --env-only {{ ansible_host }}"
    chdir: "{{ app_dir }}"
  register: env_result
  changed_when: "'Gerando' in env_result.stdout"

# O frontend embute estas URLs no build: elas entram no .env antes dele.
# HOST_BIND=127.0.0.1 deixa o túnel como a única entrada — com as portas
# abertas na rede, o cliente forjaria o X-Forwarded-For. Com o conector de
# fora, as portas vão para o IP da VM e o filtro abaixo deixa só ele entrar.
- name: Gravar as URLs públicas do domínio no .env
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: FRONTEND_URL, value: "{{ app_public_url }}" }
    - { key: API_PUBLIC_URL, value: "{{ app_api_url }}" }
    - { key: WEBSOCKET_PUBLIC_URL, value: "{{ app_ws_url }}" }
    - { key: MINIO_PUBLIC_URL, value: "{{ app_files_url }}" }
    - { key: HOST_BIND, value: "{{ ansible_host if cloudflare_conector_ip | length > 0 else '127.0.0.1' }}" }
    - { key: TRUST_PROXY_HEADERS, value: "true" }
  when: app_domain | length > 0

- name: Gravar o token do túnel Cloudflare no .env
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/.env"
    regexp: "^CLOUDFLARE_TUNNEL_TOKEN="
    line: "CLOUDFLARE_TUNNEL_TOKEN={{ cloudflare_tunnel_token }}"
  when: cloudflare_tunnel_token | length > 0
  no_log: true

- name: Gravar o SSO oficial no .env (sem Keycloak de teste)
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: KEYCLOAK_ISSUER_URL, value: "{{ keycloak_issuer_url }}" }
    - { key: KEYCLOAK_REALM, value: "{{ keycloak_realm }}" }
    - { key: KEYCLOAK_CLIENT_ID, value: "{{ keycloak_client_id }}" }
    - { key: KEYCLOAK_AUDIENCE, value: "{{ keycloak_audience }}" }
    - { key: KEYCLOAK_FRONTEND_CLIENT_ID, value: "{{ keycloak_frontend_client_id }}" }
  no_log: true

- name: Gravar Client Secret do SSO no .env
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: KEYCLOAK_CLIENT_SECRET, value: "{{ keycloak_client_secret }}" }
    - { key: KEYCLOAK_FRONTEND_CLIENT_SECRET, value: "{{ keycloak_frontend_client_secret | default(keycloak_client_secret, true) }}" }
  when: keycloak_client_secret | length > 0
  no_log: true

- name: Garantir COMPOSE_FILE da stack (túnel com o domínio, sem Keycloak de teste)
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/.env"
    regexp: "^COMPOSE_FILE="
    line: "COMPOSE_FILE=docker-compose.yml{{ ':docker-compose.cloudflare.yml' if cloudflare_tunnel_token | length > 0 else '' }}"
    state: present
  when: not enable_https | bool

- name: Escolher as imagens do registro (versão testada pelo CI)
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: "{{ 'present' if app_image_tag | length > 0 else 'absent' }}"
  loop:
    - { key: NOVA_REGISTRY, value: "{{ app_registry }}" }
    - { key: NOVA_IMAGE_TAG, value: "{{ app_image_tag }}" }
    - { key: NOVA_FRONTEND_TAG, value: "{{ app_frontend_ambiente }}-{{ app_image_tag }}" }

# As portas que o Docker publica não passam pelo INPUT do UFW: vão direto
# para o FORWARD. A cadeia DOCKER-USER, que o Docker consulta antes das
# suas, é o lugar do filtro. Pela interface da rede, só entra conexão nova
# do conector. Vai antes de subir a stack, para as portas nunca ficarem
# abertas. No after.rules, o UFW recarrega o filtro no boot e no reload.
- name: Deixar só o conector do túnel chegar às portas da stack
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    # Só ASCII: o ufw regrava este arquivo e quebra com acento.
    marker: "# {mark} Projeto-nova-v2: so o conector do tunel"
    block: |
      *filter
      :DOCKER-USER - [0:0]
      -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
      -A DOCKER-USER -i {{ ansible_default_ipv4.interface }} -s {{ cloudflare_conector_ip }} -j RETURN
      -A DOCKER-USER -i {{ ansible_default_ipv4.interface }} -j DROP
      -A DOCKER-USER -j RETURN
      COMMIT
    state: "{{ 'present' if cloudflare_conector_ip | length > 0 else 'absent' }}"
  register: filtro_conector

- name: Recarregar o UFW com o filtro do conector
  ansible.builtin.command:
    cmd: ufw reload
  when: filtro_conector is changed

- name: Subir a stack
  ansible.builtin.command:
    cmd: "bash scripts/deploy.sh --no-pull {{ ansible_host }}"
    chdir: "{{ app_dir }}"
  register: deploy_result
  changed_when: true

# Frontend e cloudflared chegam à API pela rede do compose: só dela a API
# aceita o X-Forwarded-For (o IP real vem da Cloudflare, à direita). O
# conector de fora chega pelo IP dele, que entra na lista.
- name: Descobrir a sub-rede interna do compose
  ansible.builtin.shell:
    cmd: >-
      docker network inspect
      "$(docker compose config | sed -n 's/^name: //p' | head -1)_nova_internal"
      --format '{% raw %}{{range .IPAM.Config}}{{.Subnet}}{{end}}{% endraw %}'
    chdir: "{{ app_dir }}"
  register: compose_subnet
  changed_when: false
  when: app_domain | length > 0

- name: Confiar no X-Forwarded-For só da rede interna
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/.env"
    regexp: "^TRUSTED_PROXIES="
    line: "TRUSTED_PROXIES={{ ([compose_subnet.stdout | trim] + ([cloudflare_conector_ip] if cloudflare_conector_ip | length > 0 else [])) | join(',') }}"
  register: trusted_proxies
  when: app_domain | length > 0 and compose_subnet.stdout | trim | length > 0

- name: Recriar API, worker e frontend com o TRUSTED_PROXIES novo
  ansible.builtin.command:
    cmd: docker compose up -d --no-build backend-api backend-worker frontend
    chdir: "{{ app_dir }}"
  when: trusted_proxies is changed

- name: Ativar HTTPS local (Caddy) se pedido
  ansible.builtin.command:
    cmd: "bash scripts/enable-https.sh {{ ansible_host }}"
    chdir: "{{ app_dir }}"
  when: enable_https | bool

- name: Status do deploy
  ansible.builtin.debug:
    msg: "{{ deploy_result.stdout_lines | default([]) }}"
