---
- name: Criar diretório para chaves GPG do APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Baixar chave GPG oficial do repositório Docker
  ansible.builtin.command:
    cmd: "curl -fsSL https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg -o /etc/apt/keyrings/docker.asc"
    creates: /etc/apt/keyrings/docker.asc

- name: Adicionar repositório oficial do Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Instalar Docker CE e plugins oficiais
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Configurar limites de rotação de log do Docker (/etc/docker/daemon.json)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "3"
        }
      }
  notify: Reiniciar Docker

- name: Habilitar e iniciar serviço do Docker
  ansible.builtin.systemd:
    name: docker
    enabled: yes
    state: started
