---
# Projeto-nova-v2 no Proxmox: hardening → Docker → stack (SSO oficial, sem Keycloak de teste).

- name: Hardening e configuração de base
  hosts: all
  become: true
  roles:
    - common

- name: Docker Engine
  hosts: docker_hosts
  become: true
  roles:
    - docker

- name: Deploy da stack Projeto-nova-v2
  hosts: app_servers
  become: true
  roles:
    - nova_deploy

- name: Backup (local, cópia cifrada fora e verificação semanal)
  hosts: app_servers
  become: true
  roles:
    - nova_backup

- name: Monitoramento (Prometheus, alertas, Grafana)
  hosts: app_servers
  become: true
  roles:
    - role: nova_monitoring
      when: monitoring_enabled | bool
